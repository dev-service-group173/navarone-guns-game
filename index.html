<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Allies & The Attack on Navarone Guns</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            height: 100vh; overflow: hidden;
        }

        /* Game Main Title */
        .game-header {
            width: 100%; height: 6vh;
            background: #111827;
            border-bottom: 2px solid #1e293b;
            display: flex; justify-content: center; align-items: center;
            padding: 0 10px;
        }
        .game-title {
            font-size: 14px; font-weight: 800;
            color: #38bdf8; text-transform: uppercase;
            letter-spacing: 1px; text-align: center;
        }

        /* Top Action Bar Above Game Canvas */
        #top-controls {
            width: 100%; height: 8vh;
            background: #0f172a;
            display: flex; justify-content: space-around; align-items: center;
            padding: 4px 8px; gap: 6px;
            border-bottom: 1px solid #1e293b;
        }

        /* Center Game Canvas Container */
        #game-container { 
            width: 100%; height: 60vh; 
            display: flex; justify-content: center; align-items: center; 
            background-color: #000; 
        }

        /* Bottom Dashboard Container */
        #dashboard-container {
            width: 100%; height: 26vh;
            background: linear-gradient(180deg, #111827 0%, #0b0f19 100%);
            border-top: 2px solid #1e293b;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            padding: 6px; gap: 6px;
        }

        .dash-card {
            background: rgba(30, 41, 59, 0.85); border: 1px solid #334155;
            border-radius: 8px; padding: 4px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4); overflow: hidden;
        }
        .card-title { font-size: 9px; color: #94a3b8; font-weight: bold; margin-bottom: 2px; text-transform: uppercase; text-align: center; white-space: nowrap; }
        .card-value { font-size: 11px; font-weight: 800; color: #38bdf8; text-align: center; line-height: 1.1; }
        .card-value.green { color: #22c55e; }

        .action-btn {
            width: 100%; height: 100%;
            color: #ffffff; border: none; border-radius: 6px;
            font-size: 11px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s ease;
            text-transform: uppercase;
        }
        .action-btn.red { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }
        .action-btn.purple { background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%); }
        .action-btn.blue { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); }
        .action-btn.amber { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .action-btn.emerald { background: linear-gradient(135deg, #10b981 0%, #047857 100%); }
        .action-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="game-header">
        <h1 class="game-title">The Allies & The Attack on Navarone Guns</h1>
    </div>

    <div id="top-controls">
        <button class="action-btn blue" onclick="toggleGunBunker('aa')">🛡️ RETRACT/DEPLOY AA</button>
        <button class="action-btn amber" onclick="toggleGunBunker('naval')">🏰 RETRACT/DEPLOY NAVAL</button>
    </div>

    <div id="game-container"></div>

    <div id="dashboard-container">
        <div class="dash-card">
            <button class="action-btn red" onclick="triggerShipSalvo()">🚀 FRIGATE SALVO</button>
        </div>

        <div class="dash-card">
            <button class="action-btn purple" onclick="triggerAirstrike()">✈️ AIR RAID</button>
        </div>

        <div class="dash-card">
            <button class="action-btn emerald" onclick="triggerHeavyBarrage()">⚡ HEAVY BARRAGE</button>
        </div>

        <div class="dash-card">
            <div class="card-title">🏔️ FORT DEFENSE</div>
            <div id="score-coastal" class="card-value green">Hits: 0 / 2000</div>
        </div>

        <div class="dash-card">
            <div class="card-title">🛡️ GUNS STATUS</div>
            <div id="guns-health" class="card-value">AA:100% | NAV:100%</div>
        </div>

        <div class="dash-card">
            <div class="card-title">⚔️ FLEET STATUS</div>
            <div id="fleet-status" class="card-value">ACTIVE</div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
